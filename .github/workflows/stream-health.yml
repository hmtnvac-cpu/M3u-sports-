name: Stream Health Check

on:
  schedule:
    - cron: "30 23 * * *" # 06:30 Asia/Ho_Chi_Minh
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stream-health.yml"
      - "scripts/check-streams.js"
      - "scripts/rank-streams.js"
      - "package.json"

permissions:
  contents: write

jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install checker dependencies
        run: npm install --no-audit --no-fund

      - name: Probe existing streams with ffprobe
        env:
          STREAM_CONCURRENCY: "4"
        run: npm run check-streams

      - name: Rank fastest usable sources
        run: node scripts/rank-streams.js

      - name: Commit latest health report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- stream-health.json
          if git diff --cached --quiet; then
            echo "No stream-health changes"
          else
            git commit -m "Update daily stream health report"
            git push
          fi
